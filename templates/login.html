<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Job Card System</title>
    <!-- Bootstrap CSS for clean styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="width: 380px;">
        <div class="text-center mb-4">
            <!-- COMPANY LOGO -->
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Company Logo" class="mb-3" style="max-height: 60px; max-width: 100%;">
            
            <h3 class="fw-bold">🔐 Admin Portal</h3>
            <p class="text-muted small">Job Card Management System</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 text-center small" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="e.g. Logan" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
        </form>
    </div>

</body>
</html>
